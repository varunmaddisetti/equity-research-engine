[project]
name = "equity-research-engine"
version = "0.1.0"
description = "Reproducible, public-data research reports for Nifty Smallcap 100 stocks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Venkata Ramarao Maddisetti" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "pyyaml>=6",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]
# Added in later milestones:
# fundamentals = ["lxml", "pdfplumber", "pandera"]
# report       = ["jinja2", "plotly", "kaleido", "weasyprint"]

[project.scripts]
ere = "ere.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ere"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
